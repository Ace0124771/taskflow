<!DOCTYPE html>

<head>

  <title>TaskFlow</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; }
