<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { background: #1e293b; padding: 20px; }
    h1 { margin: 0; font-size: 24px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    .container { padding: 20px; }
    .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .card { background: #1e293b; border-radius: 10px; padding: 16px 20px; min-width: 110px; }
    .card .label { font-size: 13px; color: #94a3b8; text-transform: uppercase; }
    .card .value { font-size: 32px; font-weight: bold; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #334155; font-size: 14px; }
    th { background: #334155; color: #cbd5e1; }
    .status { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; }
    .status.pending { background: #475569; color: #e2e8f0; }
    .status.running { background: #ca8a04; color: #0f172a; }
    .status.success { background: #16a34a; color: #0f172a; }
    .status.failed { background: #dc2626; color: #ffffff; }
    .updated { color: #64748b; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>TaskFlow Dashboard</h1>
    <div class="subtitle">Live view of the distributed job processing platform</div>
  </header>
  <div class="container">
    <div class="cards" id="cards"></div>
    <table>
      <thead>
        <tr><th>ID</th><th>Type</th><th>Status</th><th>Attempts</th><th>Result</th></tr>
      </thead>
      <tbody id="jobs"></tbody>
    </table>
    <div class="updated" id="updated"></div>
  </div>
  <script>
    async function refresh() {
      try {
        const stats = await (await fetch('/stats')).json();
        const jobs = await (await fetch('/jobs')).json();
        const order = ['pending', 'running', 'success', 'failed'];
        const cards = document.getElementById('cards');
        cards.innerHTML = '<div class="card"><div class="label">Total</div><div class="value">' + stats.total + '</div></div>';
        for (const name of order) {
          const count = stats.by_status[name] || 0;
          cards.innerHTML += '<div class="card"><div class="label">' + name + '</div><div class="value">' + count + '</div></div>';
        }
        const tbody = document.getElementById('jobs');
        tbody.innerHTML = '';
        jobs.slice().reverse().forEach(function (job) {
          const result = job.result === null ? '' : job.result;
          tbody.innerHTML +=
            '<tr><td>' + job.id + '</td><td>' + job.task_type + '</td>' +
            '<td><span class="status ' + job.status + '">' + job.status + '</span></td>' +
            '<td>' + job.attempts + '</td><td>' + result + '</td></tr>';
        });
        document.getElementById('updated').textContent = 'Last updated ' + new Date().toLocaleTimeString();
      } catch (error) {
        document.getElementById('updated').textContent = 'Could not reach the API. Is it running?';
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
